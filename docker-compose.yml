services:
  user-service:
    build: .
    container_name: user-service
    ports:
      - "8001:8000"
    env_file: .env
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - polls-network

  user-db:
    image: mysql:8.0
    container_name: user-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - user_db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - polls-network

volumes:
  user_db_data:

networks:
  polls-network:
    external: true
